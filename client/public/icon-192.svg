  <rect x="14" y="38" width="8" height="52" fill="#4cba6f"/>
  <rect x="14" y="80" width="28" height="10" fill="#4cba6f"/>
  <polygon points="40,80 49,80 67,122 58,122" fill="#4cba6f"/>
  <rect x="58" y="114" width="14" height="8" fill="#4cba6f"/>

  <!-- KANDZ text -->
