<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160">
  <!-- Main green vertical block (KANDZ sits on this) -->
  <rect x="0" y="0" width="230" height="105" fill="#4cba6f"/>

  <!-- Horizontal green bar (Communications sits on this) -->
  <rect x="0" y="105" width="520" height="40" fill="#4cba6f"/>

  <!-- Diagonal step connector (bottom-right of vertical block into horizontal bar) -->
  <polygon points="230,80 260,80 260,105 230,105" fill="#4cba6f"/>

  <!-- KANDZ text on the green vertical block -->
  <text x="115" y="78"
    font-family="Impact, 'Arial Narrow', 'Arial Black', sans-serif"
    font-weight="900"
    font-size="72"
    fill="white"
    text-anchor="middle"
    letter-spacing="2">KANDZ</text>

  <!-- WiFi icon on the center horizontal line (junction area) -->
  <circle cx="258" cy="97" r="5" fill="white"/>
  <path d="M 244,87 A 14,14 0 0 1 272,87" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <path d="M 231,75 A 28,28 0 0 1 285,75" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/>

  <!-- Communications text on horizontal bar -->
  <text x="390" y="132"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    fill="white"
    text-anchor="middle"
    letter-spacing="1">Communications</text>
</svg>
