<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 148">
  <!-- Green stepped icon — corner bracket + arm + diagonal + foot -->
  <!-- Top horizontal bar (corner of bracket) -->
  <rect x="0" y="0" width="30" height="10" fill="#4cba6f"/>
  <!-- Left vertical bar -->
  <rect x="0" y="0" width="12" height="90" fill="#4cba6f"/>
  <!-- Middle horizontal arm -->
  <rect x="12" y="78" width="52" height="12" fill="#4cba6f"/>
  <!-- Diagonal stroke going down-right -->
  <polygon points="52,78 64,78 98,138 86,138" fill="#4cba6f"/>
  <!-- Bottom foot -->
  <rect x="84" y="130" width="20" height="8" fill="#4cba6f"/>

  <!-- KANDZ text — black, visible on light backgrounds -->
  <text x="108" y="138"
    font-family="Impact, 'Arial Narrow', 'Arial Black', sans-serif"
    font-weight="900"
    font-size="118"
    fill="#111111"
    letter-spacing="1">KANDZ</text>

  <!-- Wifi icon — above the junction of arm and diagonal -->
  <circle cx="170" cy="46" r="6" fill="#4cba6f"/>
  <path d="M 153,34 A 18,18 0 0 1 187,34" fill="none" stroke="#4cba6f" stroke-width="7" stroke-linecap="round"/>
  <path d="M 136,20 A 35,35 0 0 1 204,20" fill="none" stroke="#4cba6f" stroke-width="7" stroke-linecap="round"/>

  <!-- Small green rectangle — Z accent, far right -->
  <rect x="472" y="74" width="28" height="18" fill="#4cba6f"/>
</svg>
